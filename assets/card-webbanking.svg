<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="Demo Bank: Kotlin/Kobweb banking app built to show unit, system, regression and i18n testing end to end.">
<title>Demo Bank: Kotlin/Kobweb banking app built to show unit, system, regression and i18n testing end to end.</title>
<defs>
  <style>
    .sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .arc{animation:arc 2.4s ease-in-out infinite;opacity:.25}
    .tick{stroke-dasharray:1;stroke-dashoffset:1;animation:tick 3.6s ease-out infinite}
    @keyframes arc{30%,60%{opacity:1}}
    @keyframes tick{0%{stroke-dashoffset:1}25%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
    @media (prefers-reduced-motion: reduce){.arc{animation:none;opacity:1}.tick{animation:none;stroke-dashoffset:0}}
  </style>
  <radialGradient id="g" cx="510" cy="120" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffb4a6" stop-opacity=".16"/><stop offset="1" stop-color="#ffb4a6" stop-opacity="0"/></radialGradient>
</defs>
<rect x=".5" y=".5" width="599" height="249" rx="18" fill="#161b17" stroke="#2c332d"/>
<rect x=".5" y=".5" width="599" height="249" rx="18" fill="url(#g)"/>
<rect x="0" y="34" width="4" height="40" rx="2" fill="#ffb4a6"/>
