<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260" viewBox="0 0 600 260" role="img" aria-label="GitHub stats: 552 contributions, 50 active days in the last year">
<title>GitHub stats: 552 contributions, 50 active days in the last year</title>
<defs><style>
  .sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace}
  .in{opacity:0;animation:in .6s ease-out forwards}
  .grow{transform:scaleX(0);transform-box:fill-box;animation:grow 1.2s cubic-bezier(.2,.8,.2,1) .2s forwards}
  .rise{transform:scaleY(0);transform-box:fill-box;transform-origin:bottom;animation:rise .8s ease-out forwards}
  .ring{animation:ring 1.6s cubic-bezier(.2,.8,.2,1) forwards}
  .flame{animation:flame 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
  @keyframes in{to{opacity:1}} @keyframes grow{to{transform:scaleX(1)}} @keyframes rise{to{transform:scaleY(1)}}
  @keyframes flame{50%{transform:scale(1.08,.92)}}
  @media (prefers-reduced-motion: reduce){.in,.grow,.rise,.ring,.flame{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style></defs>
<rect x=".5" y=".5" width="599" height="259" rx="18" fill="#161b17" stroke="#2c332d"/>
<text x="28" y="42" class="mono" font-size="13" letter-spacing="2" fill="#7cdb9a">▍GITHUB.STATS</text>
<text x="572" y="42" text-anchor="end" class="mono" font-size="11" fill="#8a938b">updated 2026-10-06</text>
<g class="in" style="animation-delay:0.1s" transform="translate(28,78)">
    <rect y="-11" width="6" height="6" rx="1.5" fill="#7cdb9a" opacity="1"/>
    <text x="16" y="-3" class="sans" font-size="14.5" fill="#c0c9c0">Contributions, all time</text>
    <text x="320" y="-3" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#e1e3de">552</text></g>
<g class="in" style="animation-delay:0.18s" transform="translate(28,106)">
    <rect y="-11" width="6" height="6" rx="1.5" fill="#7cdb9a" opacity="0.88"/>
    <text x="16" y="-3" class="sans" font-size="14.5" fill="#c0c9c0">Commits in 2026</text>
    <text x="320" y="-3" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#e1e3de">228</text></g>
<g class="in" style="animation-delay:0.26s" transform="translate(28,134)">
    <rect y="-11" width="6" height="6" rx="1.5" fill="#7cdb9a" opacity="0.76"/>
    <text x="16" y="-3" class="sans" font-size="14.5" fill="#c0c9c0">Pull requests</text>
    <text x="320" y="-3" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#e1e3de">53</text></g>
<g class="in" style="animation-delay:0.33999999999999997s" transform="translate(28,162)">
    <rect y="-11" width="6" height="6" rx="1.5" fill="#7cdb9a" opacity="0.64"/>
    <text x="16" y="-3" class="sans" font-size="14.5" fill="#c0c9c0">Issues</text>
    <text x="320" y="-3" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#e1e3de">7</text></g>
<g class="in" style="animation-delay:0.42000000000000004s" transform="translate(28,190)">
    <rect y="-11" width="6" height="6" rx="1.5" fill="#7cdb9a" opacity="0.52"/>
    <text x="16" y="-3" class="sans" font-size="14.5" fill="#c0c9c0">Stars earned</text>
    <text x="320" y="-3" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#e1e3de">0</text></g>
<g class="in" style="animation-delay:0.5s" transform="translate(28,218)">
    <rect y="-11" width="6" height="6" rx="1.5" fill="#7cdb9a" opacity="0.4"/>
    <text x="16" y="-3" class="sans" font-size="14.5" fill="#c0c9c0">Repos contributed to</text>
    <text x="320" y="-3" text-anchor="end" class="mono" font-size="15" font-weight="700" fill="#e1e3de">1</text></g><g transform="translate(470,140)">
    <circle r="64" fill="none" stroke="#2c332d" stroke-width="12"/>
    <circle r="64" fill="none" stroke="#7cdb9a" stroke-width="12" stroke-linecap="round" transform="rotate(-90)"
      stroke-dasharray="402.1" stroke-dashoffset="347.0" class="ring" style="--from:402.1"/>
    <text y="4" text-anchor="middle" class="sans" font-size="30" font-weight="800" fill="#e1e3de">50</text>
    <text y="26" text-anchor="middle" class="mono" font-size="11" fill="#8a938b">active days</text>
    <text y="98" text-anchor="middle" class="mono" font-size="11" fill="#8a938b">last 365 days</text></g>
  <style>@keyframes ring{from{stroke-dashoffset:402.1}}</style>
</svg>
