<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="WiFiLens: Offline Android Wi-Fi analyzer. Draw your floor plan, drop the router, and it predicts coverage room by room.">
<title>WiFiLens: Offline Android Wi-Fi analyzer. Draw your floor plan, drop the router, and it predicts coverage room by room.</title>
<defs>
  <style>
    .sans{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, 'Liberation Mono', monospace}
    .arc{animation:arc 2.4s ease-in-out infinite;opacity:.25}
    .tick{stroke-dasharray:1;stroke-dashoffset:1;animation:tick 3.6s ease-out infinite}
    @keyframes arc{30%,60%{opacity:1}}
    @keyframes tick{0%{stroke-dashoffset:1}25%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
    @media (prefers-reduced-motion: reduce){.arc{animation:none;opacity:1}.tick{animation:none;stroke-dashoffset:0}}
  </style>
  <radialGradient id="g" cx="510" cy="120" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a6c8ff" stop-opacity=".16"/><stop offset="1" stop-color="#a6c8ff" stop-opacity="0"/></radialGradient>
</defs>
<rect x=".5" y=".5" width="599" height="249" rx="18" fill="#161b17" stroke="#2c332d"/>
<rect x=".5" y=".5" width="599" height="249" rx="18" fill="url(#g)"/>
<rect x="0" y="34" width="4" height="40" rx="2" fill="#a6c8ff"/>
<text x="28" y="44" class="mono" font-size="12" letter-spacing="1.5" fill="#a6c8ff">◆ IN DEVELOPMENT</text>
<text x="572" y="44" text-anchor="end" class="mono" font-size="13" fill="#8a938b">view repo ↗</text>
<text x="28" y="86" class="sans" font-size="30" font-weight="800" fill="#e1e3de">WiFiLens</text>
<text x="28" y="120" class="sans" font-size="15" fill="#c0c9c0">Offline Android Wi-Fi analyzer. Draw your</text>
<text x="28" y="142" class="sans" font-size="15" fill="#c0c9c0">floor plan, drop the router, and it predicts</text>
<text x="28" y="164" class="sans" font-size="15" fill="#c0c9c0">coverage room by room.</text>
<g transform="translate(510,128)">
    <circle r="7" fill="#a6c8ff"/>
    <path d="M-19.5,-17.16 A26,26 0 0,1 19.5,-17.16" fill="none" stroke="#a6c8ff" stroke-width="7" stroke-linecap="round" class="arc" style="animation-delay:0s"/><path d="M-34.5,-30.360000000000003 A46,46 0 0,1 34.5,-30.360000000000003" fill="none" stroke="#a6c8ff" stroke-width="7" stroke-linecap="round" class="arc" style="animation-delay:0.3s"/><path d="M-49.5,-43.56 A66,66 0 0,1 49.5,-43.56" fill="none" stroke="#a6c8ff" stroke-width="7" stroke-linecap="round" class="arc" style="animation-delay:0.6s"/>
  </g>
<g transform="translate(28,196)"><rect width="67" height="28" rx="14" fill="#a6c8ff" fill-opacity=".1" stroke="#a6c8ff" stroke-opacity=".45"/><text x="33.5" y="18.5" text-anchor="middle" class="mono" font-size="12" fill="#a6c8ff">Kotlin</text></g><g transform="translate(103,196)"><rect width="74" height="28" rx="14" fill="#a6c8ff" fill-opacity=".1" stroke="#a6c8ff" stroke-opacity=".45"/><text x="37" y="18.5" text-anchor="middle" class="mono" font-size="12" fill="#a6c8ff">Compose</text></g><g transform="translate(185,196)"><rect width="53" height="28" rx="14" fill="#a6c8ff" fill-opacity=".1" stroke="#a6c8ff" stroke-opacity=".45"/><text x="26.5" y="18.5" text-anchor="middle" class="mono" font-size="12" fill="#a6c8ff">Room</text></g><g transform="translate(246,196)"><rect width="110" height="28" rx="14" fill="#a6c8ff" fill-opacity=".1" stroke="#a6c8ff" stroke-opacity=".45"/><text x="55" y="18.5" text-anchor="middle" class="mono" font-size="12" fill="#a6c8ff">Multi-module</text></g>
